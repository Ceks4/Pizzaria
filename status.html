<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg"><title>Meus pedidos — LosPizzanitos</title><link rel="stylesheet" href="auth.css?v=3"><style>
.card{max-width:780px}.controles{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.controle{min-height:42px;padding:8px 12px;border:2px solid #07070c;background:#fffef5;box-shadow:2px 2px 0 #6739d6;font-weight:900;cursor:pointer}.controle.ativo,.avisos{background:#9cf20d}#listaPedidos{display:grid;gap:20px}.pedido{overflow:hidden;background:#fffef5;border:3px solid #07070c;box-shadow:6px 6px 0 #6739d6}.pedido.cancelado{box-shadow:6px 6px 0 #f13b3f}.cabecalho{display:flex;justify-content:space-between;gap:12px;padding:17px;color:#fff;background:#211342;border-bottom:3px solid #07070c}.cabecalho h3{margin:0;font:italic 900 1.25rem/1 "Arial Black",Arial}.cabecalho time{display:block;margin-top:7px;color:#d8cffa;font-size:.75rem}.selo{align-self:flex-start;padding:5px 9px;color:#07070c;background:#ffd21f;border:2px solid #07070c;font-size:.7rem;font-weight:900}.selo.saiu_para_entrega{background:#28d7e5}.selo.concluido{background:#9cf20d}.selo.cancelado{color:#fff;background:#f13b3f}.corpo{padding:18px}.progresso{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:22px}.progresso:before{content:"";position:absolute;top:15px;left:16%;right:16%;height:4px;background:#d9d4df}.etapa{z-index:1;display:grid;justify-items:center;gap:7px;color:#777180;font-size:.7rem;font-weight:800;text-align:center}.ponto{display:grid;width:32px;height:32px;place-items:center;background:#fff;border:3px solid #bcb6c4;border-radius:50%}.etapa.ativa .ponto{background:#9cf20d;border-color:#07070c}.detalhes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bloco{padding:13px;background:#f0ebff;border:2px solid #07070c}.bloco h4{margin:0 0 8px;color:#6739d6;font-size:.72rem}.itens{display:grid;gap:7px;margin:0;padding:0;list-style:none}.itens li{display:flex;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px dashed #8b8297;font-size:.83rem}.dados{display:grid;gap:10px}.dado small{display:block;color:#726a7d;font-size:.65rem;font-weight:900;text-transform:uppercase}.dado span,.dado strong{display:block;font-size:.84rem;line-height:1.4}.dado.total strong{color:#6739d6;font-size:1.25rem}.rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.acoes{display:flex;flex-wrap:wrap;gap:8px}.repetir,.cancelar{min-height:40px;padding:7px 10px;border:2px solid #07070c;box-shadow:2px 2px 0 #07070c;font-weight:900;cursor:pointer}.repetir{background:#ffd21f}.cancelar{color:#fff;background:#f13b3f}.vazio{padding:28px;background:#f0ebff;border:3px dashed #07070c;text-align:center;font-weight:800}@media(max-width:560px){.cabecalho{flex-direction:column}.detalhes{grid-template-columns:1fr}.rodape{align-items:stretch;flex-direction:column}.acoes button{flex:1}.etapa{font-size:.62rem}}
</style><link rel="stylesheet" href="comic.css?v=8"></head><body class="status-page"><header class="topo"><div class="marca"><img class="marca-logo" src="favicon.svg" alt=""><div><h1>LOSPIZZANITOS</h1><p>Seus pedidos</p></div></div><nav><a class="btn-voltar-pagina" href="cardapio.html">&#8592; VOLTAR</a></nav></header><main><div class="card"><h2>MEUS PEDIDOS</h2><p class="subtitulo">Acompanhe o pedido atual ou repita um favorito.</p><div class="controles"><button class="controle ativo" data-filtro="ativos">EM ANDAMENTO</button><button class="controle" data-filtro="historico">HISTÓRICO</button><button class="controle avisos" id="avisos">ATIVAR AVISOS</button></div><p class="mensagem" id="mensagem"></p><div id="listaPedidos"></div></div></main>
<script>
const API=location.hostname==='localhost'?'http://localhost:3000':'https://pizzaria-asml.onrender.com',token=localStorage.getItem('tokenSessao'),lista=document.getElementById('listaPedidos'),mensagem=document.getElementById('mensagem');let pedidos=[],filtro='ativos';if(!token)location.href='login.html';const moeda=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),nomes={em_preparacao:'Em preparação',saiu_para_entrega:'Saiu para entrega',concluido:'Finalizado',cancelado:'Cancelado'};
async function json(r){const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||'Não foi possível concluir.');return d}function endereco(e={}){return[e.endereco&&`${e.endereco}, ${e.numero||'s/n'}`,e.bairro,e.cidade&&`${e.cidade}/${e.estado||''}`].filter(Boolean).join(' · ')}function pagamento(p){if(p.forma_pagamento==='pix')return'Pix · pago';if(p.forma_pagamento==='dinheiro')return p.troco_para?`Dinheiro · troco para ${moeda(p.troco_para)}`:'Dinheiro · sem troco';if(p.forma_pagamento==='cartao_entrega')return `Cartão de ${p.tipo_cartao==='debito'?'débito':'crédito'} · ${p.pago?'recebido':'pendente'}`;return'Não informado'}
function progresso(p){const idx=['em_preparacao','saiu_para_entrega','concluido'].indexOf(p.status),rotulos=p.status==='cancelado'?['Recebido','Cancelado','Interrompido']:['Em preparação','Saiu para entrega','Finalizado'];return`<div class="progresso">${rotulos.map((r,i)=>`<div class="etapa ${(p.status==='cancelado'?i<2:idx>=i)?'ativa':''}"><span class="ponto">${p.status==='cancelado'&&i===1?'×':i+1}</span><span>${r}</span></div>`).join('')}</div>`}
function render(){const visiveis=pedidos.filter(p=>filtro==='ativos'?['em_preparacao','saiu_para_entrega'].includes(p.status):['concluido','cancelado'].includes(p.status));lista.innerHTML='';if(!visiveis.length){lista.innerHTML=`<div class="vazio">Nenhum pedido ${filtro==='ativos'?'em andamento':'no histórico'}.</div>`;return}visiveis.forEach(p=>{const artigo=document.createElement('article');artigo.className=`pedido ${p.status==='cancelado'?'cancelado':''}`;const itens=(p.itens||[]).map(i=>`<li><span>${esc(i.nome)}</span><strong>${esc(i.quantidade)}x</strong></li>`).join('');artigo.innerHTML=`<header class="cabecalho"><div><h3>PEDIDO #${esc(p.id)}</h3><time>${esc(new Date(p.criado_em).toLocaleString('pt-BR'))}</time></div><span class="selo ${esc(p.status)}">${esc(nomes[p.status]||p.status)}</span></header><div class="corpo">${progresso(p)}<div class="detalhes"><section class="bloco"><h4>ITENS</h4><ul class="itens">${itens}</ul></section><section class="bloco dados"><div class="dado total"><small>Total</small><strong>${moeda(p.total)}</strong></div><div class="dado"><small>Entrega</small><span>${moeda(p.taxa_entrega)} · ${esc(p.prazo_estimado||'Prazo não informado')}</span></div><div class="dado"><small>Pagamento</small><span>${esc(pagamento(p))}</span></div><div class="dado"><small>Endereço</small><span>${esc(endereco(p.endereco))}</span></div></section></div>${p.status==='cancelado'?`<p class="mensagem erro">Motivo: ${esc(p.motivo_cancelamento||'Cancelado pelo estabelecimento.')}</p>`:''}<div class="rodape"><small>Atualização automática a cada 30 segundos.</small><div class="acoes"><button class="repetir">PEDIR NOVAMENTE</button>${p.status==='em_preparacao'?'<button class="cancelar">CANCELAR</button>':''}</div></div></div>`;artigo.querySelector('.repetir').onclick=()=>repetir(p.itens);const c=artigo.querySelector('.cancelar');if(c)c.onclick=()=>cancelar(p.id);lista.appendChild(artigo)})}
function repetir(itens){localStorage.setItem('carrinhoPizzaria',JSON.stringify(itens||[]));sessionStorage.setItem('carrinhoPizzaria',JSON.stringify(itens||[]));location.href='cardapio.html'}async function cancelar(id){if(!confirm('Deseja cancelar este pedido?'))return;const motivo=prompt('Informe o motivo:');if(!motivo?.trim())return;try{await json(await fetch(`${API}/api/pedidos/cliente/${id}/cancelar`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({motivo_cancelamento:motivo.trim()})}));consultar()}catch(e){mensagem.textContent=e.message;mensagem.className='mensagem erro'}}
function notificar(novos){let antigos={};try{antigos=JSON.parse(localStorage.getItem('statusPedidos')||'{}')}catch(_e){}novos.forEach(p=>{if(antigos[p.id]&&antigos[p.id]!==p.status&&p.status==='saiu_para_entrega'&&'Notification'in window&&Notification.permission==='granted')new Notification('Sua pizza saiu para entrega!',{body:`Pedido #${p.id} está a caminho.`});antigos[p.id]=p.status});localStorage.setItem('statusPedidos',JSON.stringify(antigos))}async function consultar(){try{const d=await json(await fetch(`${API}/api/pedidos/cliente`,{headers:{Authorization:`Bearer ${token}`}}));notificar(d.pedidos);pedidos=d.pedidos;mensagem.textContent='';render()}catch(e){mensagem.textContent=e.message;mensagem.className='mensagem erro';if(/sessão|login/i.test(e.message)){localStorage.removeItem('tokenSessao');setTimeout(()=>location.href='login.html',800)}}}
document.querySelectorAll('[data-filtro]').forEach(b=>b.onclick=()=>{filtro=b.dataset.filtro;document.querySelectorAll('[data-filtro]').forEach(x=>x.classList.toggle('ativo',x===b));render()});document.getElementById('avisos').onclick=async()=>{if(!('Notification'in window))return alert('Notificações não são aceitas neste navegador.');const p=await Notification.requestPermission();document.getElementById('avisos').textContent=p==='granted'?'AVISOS ATIVOS':'AVISOS BLOQUEADOS'};consultar();setInterval(consultar,30000);
</script></body></html>
