<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Status do pedido - LosPizzanitos</title>
  <link rel="stylesheet" href="auth.css?v=3">
  <style>
    .card { max-width: 560px; }
    .pedido-status { margin-top: 24px; }
    .pedido-status[hidden] { display: none; }
    #listaPedidos { display: grid; gap: 22px; }
    .pedido-status h3 { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: #5c1f1f; margin-bottom: 10px; }
    .pedido-item { padding: 20px; background: #fffef5; border: 3px solid #07070c; box-shadow: 5px 5px 0 #6739d6; }
    .status-atual { color: #a0522d; font-size: 1.25rem; font-weight: 700; }
    .linha-status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
    .etapa { padding: 12px 6px; border-top: 4px solid #e0d8cc; color: #7a6a60; text-align: center; font-size: .78rem; }
    .etapa.ativa { border-color: #a0522d; color: #5c1f1f; font-weight: 700; }
    .resumo-cliente { margin-top: 18px; padding: 13px; color: #3a2a24; background: #f0ebff; border: 2px solid #07070c; font-size: .9rem; line-height: 1.65; overflow-wrap: anywhere; }
    .btn-cancelar { margin-top: 16px; border: 1px solid #b02a2a; border-radius: 6px; padding: 9px 12px; background: transparent; color: #b02a2a; cursor: pointer; font-weight: 600; }
    .btn-cancelar:hover { background: #b02a2a; color: #fff; }
    .btn-cancelar:disabled { opacity: .55; cursor: not-allowed; }
    .badge-teste { display: inline-flex; margin-left: 8px; padding: 3px 8px; border-radius: 999px; color: #744b00; background: #fff0b8; font-size: .7rem; vertical-align: middle; }
    .pedidos-vazio { padding: 24px 14px; border: 3px dashed #07070c; background: #f0ebff; font-weight: 800; text-align: center; }
    @media (max-width: 480px) {
      .pedido-item { padding: 14px; box-shadow: 4px 4px 0 #6739d6; }
      .linha-status { gap: 5px !important; }
      .etapa { min-width: 0; padding: 9px 4px; font-size: .65rem; line-height: 1.25; }
      .status-atual { display: block; margin-top: 4px; font-size: 1.05rem; }
    }
  </style>
  <link rel="stylesheet" href="comic.css?v=3">
</head>
<body class="status-page">
  <header class="topo">
    <div class="marca"><img class="marca-logo" src="favicon.svg" alt="" aria-hidden="true"><div><h1>LOSPIZZANITOS</h1><p>Acompanhe seu pedido</p></div></div>
    <nav><a class="btn-voltar-pagina" href="cardapio.html">&#8592; VOLTAR</a><a href="cardapio.html">CARDÁPIO</a></nav>
  </header>
  <main>
    <div class="card">
      <h2>STATUS DO PEDIDO</h2>
      <p class="subtitulo">Seu pedido salvo na sua conta</p>
      <p class="mensagem" id="mensagem" role="alert"></p>
      <section class="pedido-status" id="resultado" hidden>
        <div id="listaPedidos"></div>
      </section>
    </div>
  </main>
  <script>
    const API = (() => {
      if (window.location.hostname === 'localhost') return 'http://localhost:3000';
      if (window.location.hostname.includes('render')) return window.location.origin;
      return 'https://pizzaria-asml.onrender.com';
    })();
    const nomesStatus = { em_preparacao: 'Em preparação', saiu_para_entrega: 'Saiu para entrega', concluido: 'Finalizado', cancelado: 'Cancelado' };
    const etapas = ['em_preparacao', 'saiu_para_entrega', 'concluido'];
    const resultado = document.getElementById('resultado');
    const mensagem = document.getElementById('mensagem');
    let emailCliente = null;
    try {
      emailCliente = JSON.parse(localStorage.getItem('usuarioLogado') || 'null')?.email || null;
    } catch (erro) {
      emailCliente = null;
    }

    async function lerResposta(resposta) {
      const tipo = resposta.headers.get('content-type') || '';
      if (!tipo.includes('application/json')) throw new Error('O servidor ainda não foi atualizado. Publique o backend no Render.');
      return resposta.json();
    }

    function escaparHtml(valor) {
      return String(valor).replace(/[&<>'"]/g, caractere => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[caractere]));
    }

    function mostrarPedidos(pedidos) {
      const lista = document.getElementById('listaPedidos');
      lista.innerHTML = '';
      if (!Array.isArray(pedidos) || pedidos.length === 0) {
        lista.innerHTML = '<p class="pedidos-vazio">Você ainda não tem pedidos para acompanhar.</p>';
        resultado.hidden = false;
        return;
      }
      pedidos.forEach(pedido => {
        const bloco = document.createElement('article');
        bloco.className = 'pedido-item';
        const indiceAtual = etapas.indexOf(pedido.status);
        const itens = Array.isArray(pedido.itens) ? pedido.itens.map(item => `${item.quantidade}x ${item.nome}`).join(', ') : 'Pedido sem itens';
        const endereco = pedido.endereco || {};
        const podeCancelar = pedido.status === 'em_preparacao';
        const motivo = pedido.motivo_cancelamento || pedido.motivoCancelamento || pedido.motivo || 'Pedido cancelado pelo estabelecimento.';
        const motivoCancelamento = pedido.status === 'cancelado' ? `<div class="resumo-cliente"><strong>Motivo do cancelamento:</strong> ${escaparHtml(motivo)}</div>` : '';
        bloco.innerHTML = `<h3>Pedido #${escaparHtml(pedido.id)}${pedido.teste ? '<span class="badge-teste">TESTE</span>' : ''}</h3><p>Status atual: <span class="status-atual">${escaparHtml(nomesStatus[pedido.status] || pedido.status)}</span></p><div class="linha-status"><div class="etapa ${indiceAtual >= 0 ? 'ativa' : ''}">Em preparação</div><div class="etapa ${indiceAtual >= 1 ? 'ativa' : ''}">Saiu para entrega</div><div class="etapa ${indiceAtual >= 2 ? 'ativa' : ''}">${pedido.status === 'cancelado' ? 'Cancelado' : 'Finalizado'}</div></div><div class="resumo-cliente">Itens: ${escaparHtml(itens)}<br>Total: ${escaparHtml(Number(pedido.total).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }))}<br>Entrega: ${escaparHtml(`${endereco.endereco || ''}, ${endereco.numero || ''}, ${endereco.cidade || ''}/${endereco.estado || ''}`.replace(/, ,/g, ',').replace(/\s+,\s+/g, ', ').replace(/, $/, ''))}</div>${motivoCancelamento}${podeCancelar ? '<button type="button" class="btn-cancelar">Cancelar pedido</button>' : ''}`;
        if (podeCancelar) bloco.querySelector('.btn-cancelar').addEventListener('click', () => cancelarPedido(pedido.id, bloco));
        lista.appendChild(bloco);
      });
      resultado.hidden = false;
    }

    async function cancelarPedido(id, bloco) {
      if (!confirm('Deseja realmente cancelar este pedido?')) return;
      const motivo = window.prompt('Informe o motivo do cancelamento:');
      if (motivo === null) return;
      if (!motivo.trim()) {
        alert('O motivo do cancelamento é obrigatório.');
        return;
      }
      const botao = bloco.querySelector('.btn-cancelar');
      botao.disabled = true;
      try {
        const resposta = await fetch(`${API}/api/pedidos/cliente/${id}/cancelar`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: emailCliente, motivo_cancelamento: motivo.trim() }) });
        const dados = await lerResposta(resposta);
        if (!resposta.ok) throw new Error(dados.erro);
        await consultarPedido();
      } catch (erro) {
        mensagem.textContent = erro.message || 'Não foi possível cancelar o pedido.';
        mensagem.className = 'mensagem erro';
        botao.disabled = false;
      }
    }

    async function consultarPedido() {
      if (!emailCliente) {
        mensagem.textContent = 'Entre na sua conta para acompanhar o pedido.';
        mensagem.className = 'mensagem erro';
        return;
      }
      try {
        const resposta = await fetch(`${API}/api/pedidos/cliente?email=${encodeURIComponent(emailCliente)}`);
        const dados = await lerResposta(resposta);
        if (!resposta.ok) throw new Error(dados.erro);
        mensagem.textContent = '';
        mostrarPedidos(dados.pedidos);
      } catch (erro) {
        resultado.hidden = true;
        mensagem.textContent = erro.message || 'Não foi possível consultar o pedido.';
        mensagem.className = 'mensagem erro';
      }
    }

    if (emailCliente) {
      consultarPedido();
    } else {
      mensagem.textContent = 'Entre na sua conta para acompanhar o pedido.';
      mensagem.className = 'mensagem erro';
    }
    setInterval(() => { if (!resultado.hidden) consultarPedido(); }, 30000);
  </script>
</body>
</html>
