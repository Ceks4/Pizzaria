<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status do pedido - LosPizzanitos</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    .card { max-width: 560px; }
    .pedido-status { margin-top: 28px; padding-top: 24px; border-top: 1px solid #e0d8cc; }
    .pedido-status[hidden] { display: none; }
    .pedido-status h3 { color: #5c1f1f; margin-bottom: 8px; }
    .status-atual { color: #a0522d; font-size: 1.25rem; font-weight: 700; }
    .linha-status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
    .etapa { padding: 12px 6px; border-top: 4px solid #e0d8cc; color: #7a6a60; text-align: center; font-size: .78rem; }
    .etapa.ativa { border-color: #a0522d; color: #5c1f1f; font-weight: 700; }
    .resumo-cliente { margin-top: 22px; color: #3a2a24; font-size: .9rem; line-height: 1.6; }
    @media (max-width: 480px) { .linha-status { grid-template-columns: 1fr; } .etapa { text-align: left; } }
  </style>
</head>
<body>
  <header class="topo">
    <div class="marca"><span class="bolinha"></span><div><h1>LOSPIZZANITOS</h1><p>Acompanhe seu pedido</p></div></div>
    <nav><a href="cardapio.html">CARDÁPIO</a></nav>
  </header>
  <main>
    <div class="card">
      <h2>STATUS DO PEDIDO</h2>
      <p class="subtitulo">Seu pedido salvo na sua conta</p>
      <p class="mensagem" id="mensagem" role="alert"></p>
      <section class="pedido-status" id="resultado" hidden>
        <h3 id="tituloPedido"></h3>
        <p>Status atual: <span class="status-atual" id="statusAtual"></span></p>
        <div class="linha-status">
          <div class="etapa" data-status="em_preparacao">Em preparação</div>
          <div class="etapa" data-status="saiu_para_entrega">Saiu para entrega</div>
          <div class="etapa" data-status="concluido">Concluído</div>
        </div>
        <div class="resumo-cliente" id="resumoCliente"></div>
      </section>
    </div>
  </main>
  <script>
    const API = 'https://pizzaria-asml.onrender.com';
    const nomesStatus = { em_preparacao: 'Em preparação', saiu_para_entrega: 'Saiu para entrega', concluido: 'Concluído' };
    const etapas = ['em_preparacao', 'saiu_para_entrega', 'concluido'];
    const resultado = document.getElementById('resultado');
    const mensagem = document.getElementById('mensagem');
    let emailCliente = null;
    try {
      emailCliente = JSON.parse(localStorage.getItem('usuarioLogado') || 'null')?.email || null;
    } catch (erro) {
      emailCliente = null;
    }

    async function lerResposta(resposta) {
      const tipo = resposta.headers.get('content-type') || '';
      if (!tipo.includes('application/json')) throw new Error('O servidor ainda não foi atualizado. Publique o backend no Render.');
      return resposta.json();
    }

    function mostrarPedido(pedido) {
      document.getElementById('tituloPedido').textContent = `Pedido #${pedido.id}`;
      document.getElementById('statusAtual').textContent = nomesStatus[pedido.status] || pedido.status;
      const indiceAtual = etapas.indexOf(pedido.status);
      document.querySelectorAll('.etapa').forEach((etapa, indice) => etapa.classList.toggle('ativa', indice <= indiceAtual));
      const endereco = pedido.endereco;
      document.getElementById('resumoCliente').textContent = `Cliente: ${pedido.cliente_nome} | Total: ${Number(pedido.total).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}\nEntrega: ${endereco.endereco}, ${endereco.numero}, ${endereco.cidade}/${endereco.estado}`;
      resultado.hidden = false;
    }

    async function consultarPedido() {
      if (!emailCliente) {
        mensagem.textContent = 'Entre na sua conta para acompanhar o pedido.';
        mensagem.className = 'mensagem erro';
        return;
      }
      try {
        const resposta = await fetch(`${API}/api/pedidos/cliente?email=${encodeURIComponent(emailCliente)}`);
        const dados = await lerResposta(resposta);
        if (!resposta.ok) throw new Error(dados.erro);
        mensagem.textContent = '';
        mostrarPedido(dados.pedido);
      } catch (erro) {
        resultado.hidden = true;
        mensagem.textContent = erro.message || 'Não foi possível consultar o pedido.';
        mensagem.className = 'mensagem erro';
      }
    }

    if (emailCliente) {
      consultarPedido();
    } else {
      mensagem.textContent = 'Entre na sua conta para acompanhar o pedido.';
      mensagem.className = 'mensagem erro';
    }
    setInterval(() => { if (!resultado.hidden) consultarPedido(); }, 30000);
  </script>
</body>
</html>
