<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>Finalizar pedido — LosPizzanitos</title><link rel="stylesheet" href="auth.css?v=3">
<style>.card{max-width:570px}.resumo-pedido{margin-bottom:22px;padding:16px;background:#f0ebff;border:3px solid #07070c}.resumo-pedido h3{margin:0 0 10px;color:#6739d6;font-size:.8rem}.resumo-item,.resumo-linha{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:.86rem}.resumo-linha{margin-top:8px;padding-top:10px;border-top:2px dashed #8b8297}.resumo-total{font-size:1.1rem;font-weight:900}.campo-cep{display:flex;align-items:flex-end;gap:10px}.campo-cep>div{flex:1}.btn-cep{min-height:44px;padding:10px 15px;color:#07070c;background:#ffd21f;border:3px solid #07070c;box-shadow:3px 3px 0 #6739d6;font-weight:900;cursor:pointer}.entrega-resultado{display:none;margin:14px 0;padding:13px;color:#211342;background:#eaffc6;border:2px solid #07070c;font-size:.85rem;line-height:1.55}.entrega-resultado.visivel{display:block}.pagamento-info{margin-bottom:18px;padding:12px 14px;background:#fff4c7;border:2px solid #07070c;font-size:.83rem;line-height:1.45}@media(max-width:480px){.campo-cep{align-items:stretch;flex-direction:column}.btn-cep{width:100%}}</style><link rel="stylesheet" href="comic.css?v=8"></head>
<body class="checkout-page"><header class="topo"><div class="marca"><img class="marca-logo" src="favicon.svg" alt="" aria-hidden="true"><div><h1>LOSPIZZANITOS</h1><p>Entrega rápida e segura</p></div></div><nav><a class="btn-voltar-pagina" href="cardapio.html">&#8592; VOLTAR</a><a href="status.html">MEUS PEDIDOS</a></nav></header>
<main><div class="card"><h2>FINALIZAR PEDIDO</h2><p class="subtitulo">Confira o carrinho e valide a entrega.</p>
<section class="resumo-pedido"><h3>SEU PEDIDO</h3><div id="listaItens"></div><div class="resumo-linha"><span>Subtotal</span><strong id="subtotalPedido">R$ 0,00</strong></div><div class="resumo-item"><span>Entrega</span><strong id="taxaEntrega">A calcular</strong></div><div class="resumo-item resumo-total"><span>Total</span><strong id="totalPedido">R$ 0,00</strong></div></section>
<div class="pagamento-info">A taxa e o prazo são calculados pelo CEP. Pedidos fora da área ou do horário de funcionamento não são enviados.</div>
<form id="formEndereco"><div class="campo-cep"><div><label for="cep">CEP</label><input id="cep" name="cep" maxlength="9" inputmode="numeric" placeholder="00000-000" required></div><button type="button" class="btn-cep" id="btnBuscarCep">BUSCAR</button></div>
<div><label for="endereco">Endereço</label><input id="endereco" name="endereco" maxlength="140" required></div><div class="linha-dupla"><div><label for="numero">Número</label><input id="numero" name="numero" maxlength="20" required></div><div><label for="complemento">Complemento</label><input id="complemento" name="complemento" maxlength="80" placeholder="Opcional"></div></div><div><label for="bairro">Bairro</label><input id="bairro" name="bairro" maxlength="100" required></div><div class="linha-dupla"><div><label for="cidade">Cidade</label><input id="cidade" name="cidade" maxlength="80" required></div><div><label for="estado">Estado</label><input id="estado" name="estado" maxlength="2" required></div></div>
<div class="entrega-resultado" id="entregaResultado"></div><button type="submit" class="btn-principal" id="btnFinalizar">CALCULAR E CONTINUAR</button><p class="mensagem" id="mensagem" role="status"></p></form></div></main>
<script>
const API=location.hostname==='localhost'?'http://localhost:3000':'https://pizzaria-asml.onrender.com',CHAVE='carrinhoPizzaria',token=localStorage.getItem('tokenSessao');let carrinho=[];try{carrinho=JSON.parse(localStorage.getItem(CHAVE)||sessionStorage.getItem(CHAVE)||'[]');if(!Array.isArray(carrinho))carrinho=[]}catch(_e){}if(!token){location.href='login.html'}
const moeda=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),lista=document.getElementById('listaItens');let subtotal=0;carrinho.forEach(item=>{const q=Number(item.quantidade)||0,p=Number(item.preco)||0;subtotal+=q*p;const linha=document.createElement('div');linha.className='resumo-item';const nome=document.createElement('span');nome.textContent=`${q}x ${item.nome}`;const valor=document.createElement('span');valor.textContent=moeda(q*p);linha.append(nome,valor);lista.appendChild(linha)});if(!carrinho.length)lista.textContent='Seu carrinho está vazio.';document.getElementById('subtotalPedido').textContent=moeda(subtotal);document.getElementById('totalPedido').textContent=moeda(subtotal);
const cep=document.getElementById('cep');cep.addEventListener('input',()=>{let v=cep.value.replace(/\D/g,'').slice(0,8);if(v.length>5)v=`${v.slice(0,5)}-${v.slice(5)}`;cep.value=v});
async function json(res){const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(d.erro||'Não foi possível concluir.');return d}
document.getElementById('btnBuscarCep').addEventListener('click',async()=>{if(cep.value.replace(/\D/g,'').length!==8)return alert('Digite um CEP válido.');const b=document.getElementById('btnBuscarCep');b.disabled=true;try{const d=await json(await fetch(`https://viacep.com.br/ws/${cep.value.replace(/\D/g,'')}/json/`));if(d.erro)throw new Error('CEP não encontrado.');document.getElementById('endereco').value=d.logradouro||'';document.getElementById('bairro').value=d.bairro||'';document.getElementById('cidade').value=d.localidade||'';document.getElementById('estado').value=d.uf||'';document.getElementById('numero').focus()}catch(e){alert(e.message)}finally{b.disabled=false}});
document.getElementById('formEndereco').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('mensagem'),btn=document.getElementById('btnFinalizar');if(!carrinho.length){msg.textContent='Seu carrinho está vazio.';msg.className='mensagem erro';return}btn.disabled=true;btn.textContent='VALIDANDO ENTREGA...';msg.textContent='';const endereco=Object.fromEntries(new FormData(e.currentTarget).entries());try{const entrega=await json(await fetch(`${API}/api/entrega/calcular`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({endereco})}));document.getElementById('taxaEntrega').textContent=moeda(entrega.taxa);document.getElementById('totalPedido').textContent=moeda(subtotal+entrega.taxa);const box=document.getElementById('entregaResultado');box.textContent=`${entrega.zona} · Taxa ${moeda(entrega.taxa)} · Previsão ${entrega.prazo}`;box.classList.add('visivel');localStorage.setItem('enderecoEntrega',JSON.stringify(endereco));localStorage.setItem('entregaCalculada',JSON.stringify(entrega));location.href='pagamento.html'}catch(erro){msg.textContent=erro.message;msg.className='mensagem erro';if(/sessão|login/i.test(erro.message)){localStorage.removeItem('tokenSessao');setTimeout(()=>location.href='login.html',900)}}finally{btn.disabled=false;btn.textContent='CALCULAR E CONTINUAR'}});
</script></body></html>
