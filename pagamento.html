<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — LosPizzanitos</title>
<link rel="stylesheet" href="auth.css">
<script src="https://sdk.mercadopago.com/js/v2"></script>
<style>
  .card { max-width: 460px; text-align: center; }
  .valor-total {
    font-size: 2rem;
    font-weight: 700;
    color: #5c1f1f;
    margin-bottom: 24px;
  }
  #areaQrCode { display: none; }
  #qrcodeImg {
    width: 220px;
    height: 220px;
    margin: 0 auto 18px;
    border: 1px solid #e0d8cc;
    border-radius: 10px;
    display: block;
  }
  .copia-cola {
    background: #faf8f4;
    border: 1px solid #e0d8cc;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.75rem;
    word-break: break-all;
    color: #3a2a24;
    margin-bottom: 14px;
    text-align: left;
  }
  .btn-copiar {
    background: #a0522d;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .btn-copiar:hover { background: #7a3a20; }
  .status-pix {
    font-size: 0.85rem;
    font-weight: 600;
    color: #7a6a60;
  }
  .status-pix.pago { color: #2a7a3d; }
  .metodos-pagamento { display: grid; gap: 12px; text-align: left; }
  .metodo-pagamento {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fffaf3;
    border: 1px solid #e0d8cc;
    color: #fff;
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .metodo-pagamento:hover,
  .metodo-pagamento:focus-visible {
    background: #fff;
    border-color: #a0522d;
    transform: translateY(-2px);
  }
  .metodo-pagamento:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .metodo-icone {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    flex: 0 0 44px;
    border-radius: 8px;
    background: #5c1f1f;
    color: #fff;
  }
  .metodo-icone.pix { background: #008f83; }
  .metodo-icone svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pix-marca { font-size: 0.82rem; font-weight: 800; letter-spacing: 0.04em; }
  .metodo-texto { display: grid; gap: 3px; color: #3a2a24; }
  .metodo-titulo { font-size: 0.95rem; font-weight: 700; }
  .metodo-detalhe { color: #7a6a60; font-size: 0.78rem; }
  .metodo-seta { margin-left: auto; color: #a0522d; font-size: 1.25rem; }
  .nota-seguranca { color: #7a6a60; font-size: 0.78rem; margin-top: 2px; text-align: center; }
  #areaCartao { display: none; text-align: left; }
  #cardPaymentBrick_container { margin-top: 12px; }
  .btn-voltar-metodos {
    margin-top: 12px;
    border: 0;
    background: transparent;
    color: #a0522d;
    font: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
 
<header class="topo">
  <div class="marca">
    <span class="bolinha"></span>
    <div>
      <h1>LOSPIZZANITOS</h1>
      <p>Pizzaria sabor caseiro · forno a lenha</p>
    </div>
  </div>
  <nav>
    <a href="cardapio.html">CARDÁPIO</a>
  </nav>
</header>
 
<main>
  <div class="card">
    <h2>PAGAMENTO</h2>
    <p class="subtitulo">Escolha uma forma de pagamento para confirmar seu pedido</p>
 
    <div class="valor-total" id="valorTotal">R$ 0,00</div>
 
    <div id="areaInicial" class="metodos-pagamento">
      <button class="metodo-pagamento" id="btnGerarPix" type="button">
        <span class="metodo-icone pix" aria-hidden="true"><span class="pix-marca">PIX</span></span>
        <span class="metodo-texto">
          <span class="metodo-titulo">Pagar com Pix</span>
          <span class="metodo-detalhe">Aprovação rápida pelo QR Code</span>
        </span>
        <span class="metodo-seta" aria-hidden="true">&#8250;</span>
      </button>
      <button class="metodo-pagamento" id="btnPagarCartao" type="button">
        <span class="metodo-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"></rect><path d="M2.5 9.5h19M6 14h4"></path></svg>
        </span>
        <span class="metodo-texto">
          <span class="metodo-titulo">Pagar com cartão</span>
          <span class="metodo-detalhe">Crédito ou débito pelo Mercado Pago</span>
        </span>
        <span class="metodo-seta" aria-hidden="true">&#8250;</span>
      </button>
      <p class="nota-seguranca">Pagamento protegido. Os dados do cartão não ficam nesta página.</p>
    </div>

    <p class="mensagem" id="mensagem" role="status" aria-live="polite"></p>
 
    <div id="areaQrCode">
      <img id="qrcodeImg" alt="QR Code Pix">
      <div class="copia-cola" id="copiaCola"></div>
      <button class="btn-copiar" id="btnCopiar">COPIAR CÓDIGO PIX</button>
      <p class="status-pix" id="statusPix">Aguardando pagamento...</p>
    </div>

    <div id="areaCartao">
      <div id="cardPaymentBrick_container"></div>
      <button class="btn-voltar-metodos" id="btnVoltarMetodos" type="button">&#8592; Escolher outra forma de pagamento</button>
    </div>
  </div>
</main>
 
<script>
  const URL_BACKEND = 'https://pizzaria-asml.onrender.com';
  const VALOR_MINIMO_CARTAO = 1;
 
  // ---- Carrega carrinho e endereço salvos ----
  const chaveCarrinho = 'carrinhoPizzaria';
  let carrinho = [];

  try {
    const carrinhoSalvo = JSON.parse(localStorage.getItem(chaveCarrinho) || '[]');
    carrinho = Array.isArray(carrinhoSalvo) ? carrinhoSalvo : [];

    if (carrinho.length === 0) {
      const carrinhoLegacy = JSON.parse(localStorage.getItem('carrinho') || '[]');
      if (Array.isArray(carrinhoLegacy) && carrinhoLegacy.length > 0) {
        carrinho = carrinhoLegacy;
        localStorage.setItem(chaveCarrinho, JSON.stringify(carrinho));
        localStorage.removeItem('carrinho');
      }
    }
  } catch (erro) {
    localStorage.removeItem(chaveCarrinho);
    localStorage.removeItem('carrinho');
  }

  const endereco = JSON.parse(localStorage.getItem('enderecoEntrega')) || {};
  const usuario = JSON.parse(localStorage.getItem('usuarioLogado')) || {};

  let total = 0;
  carrinho.forEach(item => total += item.preco * item.quantidade);
  total = Number(total.toFixed(2));
  document.getElementById('valorTotal').textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
 
  const btnGerarPix = document.getElementById('btnGerarPix');
  const mensagem = document.getElementById('mensagem');
  const areaInicial = document.getElementById('areaInicial');
  const areaQrCode = document.getElementById('areaQrCode');
  const statusPix = document.getElementById('statusPix');
  const btnPagarCartao = document.getElementById('btnPagarCartao');
  const areaCartao = document.getElementById('areaCartao');
  const btnVoltarMetodos = document.getElementById('btnVoltarMetodos');
 
  let pagamentoId = null;
  let intervaloChecagem = null;
  let controladorCartao = null;

  function validarTotalPagamento(valor, minimo = 0.01) {
    return Number.isFinite(valor) && valor >= minimo && Number(valor.toFixed(2)) === valor;
  }

  async function inicializarCartao() {
    if (controladorCartao) return;

    if (!validarTotalPagamento(total, VALOR_MINIMO_CARTAO)) {
      throw new Error(`O valor mínimo para pagar com cartão é R$ ${VALOR_MINIMO_CARTAO.toFixed(2).replace('.', ',')}.`);
    }

    const resposta = await fetch(`${URL_BACKEND}/api/pagamento-config`);
    const config = await lerResposta(resposta);
    if (!resposta.ok || !config.publicKey) {
      throw new Error('O cartão ainda não está configurado no servidor. Adicione MP_PUBLIC_KEY no Render.');
    }

    const mp = new MercadoPago(config.publicKey, { locale: 'pt-BR' });
    const bricksBuilder = mp.bricks();
    controladorCartao = await bricksBuilder.create('cardPayment', 'cardPaymentBrick_container', {
      initialization: {
        amount: total,
        payer: { email: usuario.email || '' }
      },
      customization: {
        visual: { style: { theme: 'default' } }
      },
      callbacks: {
        onReady: () => {},
        onError: erro => {
          console.error('Erro no formulário de cartão:', erro);
          mensagem.textContent = 'Não foi possível carregar o formulário do cartão.';
          mensagem.className = 'mensagem erro';
        },
        onSubmit: async dadosCartao => {
          try {
            const respostaPagamento = await fetch(`${URL_BACKEND}/api/pagamento-cartao`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                ...dadosCartao,
                description: 'Pedido LosPizzanitos'
              })
            });
            const dados = await lerResposta(respostaPagamento);
            if (!respostaPagamento.ok) {
              throw new Error(dados.erro || 'Não foi possível processar o cartão.');
            }

            if (dados.status === 'approved') {
              pagamentoId = dados.id;
              await salvarPedido(pagamentoId);
              localStorage.removeItem(chaveCarrinho);
              localStorage.removeItem('carrinho');
              window.location.href = 'status.html';
              return;
            }

            throw new Error(dados.detalhe || 'O pagamento não foi aprovado. Tente outro cartão.');
          } catch (erro) {
            mensagem.textContent = erro.message || 'Não foi possível processar o cartão.';
            mensagem.className = 'mensagem erro';
            throw erro;
          }
        }
      }
    });
  }

  async function lerResposta(resposta) {
    const tipo = resposta.headers.get('content-type') || '';
    if (!tipo.includes('application/json')) {
      throw new Error('O servidor de pagamentos ainda não foi atualizado. Publique o backend no Render.');
    }

    return resposta.json();
  }

  btnPagarCartao.addEventListener('click', async () => {
    if (carrinho.length === 0) {
      mensagem.textContent = 'Seu carrinho está vazio.';
      mensagem.className = 'mensagem erro';
      return;
    }

    btnPagarCartao.disabled = true;
    btnGerarPix.disabled = true;
    areaInicial.style.display = 'none';
    areaCartao.style.display = 'block';

    try {
      await inicializarCartao();
    } catch (erro) {
      mensagem.textContent = erro.message || 'Não foi possível conectar ao servidor.';
      mensagem.className = 'mensagem erro';
      btnPagarCartao.disabled = false;
      btnGerarPix.disabled = false;
      areaCartao.style.display = 'none';
      areaInicial.style.display = 'grid';
    }
  });

  btnVoltarMetodos.addEventListener('click', () => {
    if (controladorCartao) {
      controladorCartao.unmount();
      controladorCartao = null;
    }
    areaCartao.style.display = 'none';
    areaInicial.style.display = 'grid';
    btnPagarCartao.disabled = false;
    btnGerarPix.disabled = false;
  });
 
  btnGerarPix.addEventListener('click', async () => {
    if (carrinho.length === 0) {
      mensagem.textContent = 'Seu carrinho está vazio.';
      mensagem.className = 'mensagem erro';
      return;
    }
 
    btnGerarPix.disabled = true;
    btnGerarPix.querySelector('.metodo-titulo').textContent = 'Gerando Pix...';
 
    try {
      const resposta = await fetch(`${URL_BACKEND}/api/pagamento-pix`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          valor: total,
          descricao: 'Pedido LosPizzanitos',
          nome: usuario.nome || 'Cliente',
          email: usuario.email || '',
          telefone: '',
          cpf: ''
        })
      });
 
      const dados = await resposta.json();
 
      if (dados.erro) {
        mensagem.textContent = dados.erro;
        mensagem.className = 'mensagem erro';
        btnGerarPix.disabled = false;
        btnGerarPix.querySelector('.metodo-titulo').textContent = 'Pagar com Pix';
        return;
      }
 
      pagamentoId = dados.id;
      document.getElementById('qrcodeImg').src = dados.qrCodeBase64;
      document.getElementById('copiaCola').textContent = dados.codigoCopiaCola;
 
      areaInicial.style.display = 'none';
      areaQrCode.style.display = 'block';
 
      // Checa o status a cada 5 segundos
      intervaloChecagem = setInterval(checarStatus, 5000);
 
    } catch (erro) {
      mensagem.textContent = 'Não foi possível conectar ao servidor.';
      mensagem.className = 'mensagem erro';
      btnGerarPix.disabled = false;
      btnGerarPix.querySelector('.metodo-titulo').textContent = 'Pagar com Pix';
    }
  });
 
  async function checarStatus() {
    if (!pagamentoId) return;
 
    try {
      const resposta = await fetch(`${URL_BACKEND}/api/pagamento-status/${pagamentoId}`);
      const dados = await resposta.json();
 
      if (dados.status === 'approved') {
        clearInterval(intervaloChecagem);
        statusPix.textContent = 'Pagamento confirmado! 🎉';
        statusPix.className = 'status-pix pago';
 
        await salvarPedido();

        localStorage.removeItem(chaveCarrinho);
        localStorage.removeItem('carrinho');

        setTimeout(() => {
          window.location.href = 'status.html';
        }, 2500);
      } else if (dados.status === 'rejected') {
        clearInterval(intervaloChecagem);
        statusPix.textContent = 'O pagamento foi recusado. Gere um novo Pix.';
      }
    } catch (erro) {
      // silencioso — tenta de novo no próximo intervalo
    }
  }
 
  async function salvarPedido(pagamentoIdInformado = pagamentoId) {
    try {
      await fetch(`${URL_BACKEND}/api/pedidos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: usuario.email || '',
          nome: usuario.nome || 'Cliente',
          itens: carrinho,
          total: total,
          endereco: endereco,
          pagamento_id: pagamentoIdInformado
        })
      });
    } catch (erro) {
      // se falhar em salvar, o cliente ainda pagou — não trava a tela por isso
    }
  }
 
  document.getElementById('btnCopiar').addEventListener('click', () => {
    const texto = document.getElementById('copiaCola').textContent;
    navigator.clipboard.writeText(texto);
    const btn = document.getElementById('btnCopiar');
    const original = btn.textContent;
    btn.textContent = 'COPIADO!';
    setTimeout(() => btn.textContent = original, 1500);
  });
</script>
 
</body>
</html>
